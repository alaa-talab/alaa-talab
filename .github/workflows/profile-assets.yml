name: generate profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: alaa-talab
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Platane/snk is a Docker container action; the dist/ dir it creates
      # (and the files in it) end up owned by root, so the next step
      # (running as the normal `runner` user) can't create new files there
      # without this.
      - name: fix dist/ ownership after the container action
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: generate stats.svg and top-langs.svg
        run: node scripts/generate-stats.mjs
        env:
          STATS_USERNAME: alaa-talab
          STATS_OUT_DIR: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
